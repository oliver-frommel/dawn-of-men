<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    html, body, #canvas { width: 100%; height: 100%; margin: 0; }
    body { background: $GODOT_SPLASH_COLOR; color: #f1e8d6; font: 16px system-ui, sans-serif; }
    #canvas { display: block; }
    #status { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 1rem; padding: 1.5rem; text-align: center; }
    #status[hidden] { display: none; }
    #splash { max-width: 80vw; max-height: 55vh; }
    #message { max-width: 34rem; white-space: pre-line; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas">This game requires a browser with WebGL 2 support.</canvas>
  <div id="status" aria-live="polite">
    <img id="splash" src="$GODOT_SPLASH" alt="">
    <progress id="progress" aria-label="Loading game"></progress>
    <div id="message">Loading game…</div>
  </div>
  <script src="$GODOT_URL"></script>
  <script>
    const config = $GODOT_CONFIG;
    const threads = $GODOT_THREADS_ENABLED;
    const engine = new Engine(config);
    const statusPanel = document.getElementById("status");
    const progress = document.getElementById("progress");
    const message = document.getElementById("message");
    const retryKey = "godot-isolation-retry";
    const hostingHint = "Open the game directly over HTTPS or use run-web.command locally. If you control the host, set COOP to same-origin and COEP to require-corp.";

    function waitForWorker(workers, registration, workerURL) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => finish(new Error("The game’s service worker did not take control.")), 15000);
        let installing;
        function finish(error) {
          clearTimeout(timer);
          workers.removeEventListener("controllerchange", check);
          registration.removeEventListener("updatefound", check);
          installing?.removeEventListener("statechange", check);
          if (error) reject(error);
          else resolve();
        }
        function check() {
          if (installing !== registration.installing) {
            installing?.removeEventListener("statechange", check);
            installing = registration.installing;
            installing?.addEventListener("statechange", check);
          }
          if (workers.controller?.scriptURL === workerURL && !registration.waiting && !installing) {
            finish();
            return;
          }
          (registration.waiting || registration.active)?.postMessage("claim");
        }
        workers.addEventListener("controllerchange", check);
        registration.addEventListener("updatefound", check);
        check();
      });
    }

    async function start() {
      const page = new URL(location.href);
      const missing = Engine.getMissingFeatures({ threads });
      if (missing.length && threads && !globalThis.crossOriginIsolated) {
        if (page.searchParams.has(retryKey) || !config.serviceWorker || !navigator.serviceWorker) {
          throw new Error("Cross-origin isolation is unavailable. " + hostingHint);
        }
        message.textContent = "Preparing the game for this browser…";
        const workers = navigator.serviceWorker;
        const workerURL = new URL(config.serviceWorker, document.baseURI).href;
        const scope = new URL("./", workerURL).href;
        const existing = await workers.getRegistration(scope);
        const registeredWorker = existing?.installing || existing?.waiting || existing?.active;
        if (existing?.scope === scope && registeredWorker && registeredWorker.scriptURL !== workerURL) {
          throw new Error("Another service worker controls this address. " + hostingHint);
        }
        const registration = await workers.register(workerURL, { updateViaCache: "none" });
        await waitForWorker(workers, registration, workerURL);
        page.searchParams.set(retryKey, "1");
        location.replace(page.href);
        return;
      }
      if (missing.length) throw new Error(missing.join("\n"));
      if (page.searchParams.has(retryKey)) {
        page.searchParams.delete(retryKey);
        history.replaceState(null, "", page.href);
      }
      await engine.startGame({
        onProgress(current, total) {
          if (total > 0) {
            progress.max = total;
            progress.value = current;
          }
        }
      });
      statusPanel.hidden = true;
    }

    start().catch(error => {
      console.error(error);
      progress.hidden = true;
      message.textContent = error.message || String(error);
    });
  </script>
</body>
</html>
